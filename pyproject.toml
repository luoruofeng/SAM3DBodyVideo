[project]
name = "sam3dbody-video"
version = "0.1.0"
description = "视频 -> SAM 3D Body 逐帧推理 -> 时间平滑 -> 动作 JSON 的本地离线流水线"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "pillow>=10.0",
    "tqdm>=4.66",
    "scipy>=1.13",
    "trimesh>=4.4",
]

[project.optional-dependencies]
# SAM 3D Body 官方推理链路所需依赖（安装方式见 INSTALL.md / scripts/setup_env.ps1）
sam3d = [
    "pytorch-lightning>=2.2",
    "pyrender>=0.1.45",
    "yacs>=0.1.8",
    "scikit-image>=0.22",
    "einops>=0.7",
    "timm>=1.0",
    "dill>=0.3",
    "pandas>=2.2",
    "rich>=13.7",
    "hydra-core>=1.3",
    "hydra-colorlog>=1.2",
    "pyrootutils>=1.0",
    "webdataset>=0.2",
    "chump>=1.0",
    "networkx>=3.2.1",
    "roma>=1.4",
    "joblib>=1.4",
    "seaborn>=0.13",
    "appdirs>=1.4",
    "cython>=3.0",
    "jsonlines>=3.1",
    "xtcocotools>=1.14",
    "optree>=0.12",
    "fvcore>=0.1.5.post20221221",
    "pycocotools>=2.0.7",
    "tensorboard>=2.16",
    "huggingface_hub>=0.23",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "core", "dataio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
